name: Rafraîchir les classements M+

on:
  schedule:
    # Toutes les 15 minutes. GitHub n'est pas parfaitement ponctuel sur les
    # crons (léger retard possible), mais c'est largement suffisant ici.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # permet aussi de le déclencher manuellement depuis l'onglet Actions

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'endpoint de rafraîchissement
        run: |
          curl -sf -X POST \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            "https://pgc-mplus-leaderboard.vercel.app/api/refresh"
